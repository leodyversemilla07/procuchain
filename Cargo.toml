[package]
name = "procuchain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Governed eProcurement document platform"
license = "AGPL-3.0-or-later"

[lib]
name = "procuchain"
path = "src/lib.rs"

[[bin]]
name = "procuchain"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v7", "serde"] }
