; PHP Configuration for Heroku
; These settings apply to PHP when running on Heroku

; Upload limits - Allow up to 50MB file uploads
upload_max_filesize = 50M
post_max_size = 52M

; Memory and execution limits for large file processing
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Increase max input variables for complex forms
max_input_vars = 3000
