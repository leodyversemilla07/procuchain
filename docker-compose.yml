services:
  mysql:
    image: mysql:9.4
    container_name: procuchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: procuchain
      MYSQL_USER: procuchain
      MYSQL_PASSWORD: procuchain
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pprocuchain", "-uprocuchain"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - procuchain

  redis:
    image: redis:7-alpine
    container_name: procuchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - procuchain

  multichain:
    build:
      context: .
      dockerfile: Dockerfile.multichain
    container_name: procuchain-multichain-dev
    restart: unless-stopped
    environment:
      - CHAIN_NAME=procuchain-dev
      - RPC_USER=multichainrpc
      - RPC_PASSWORD=multichainrpc
      - RPC_PORT=7450
      - P2P_PORT=7449
      # Restrict RPC to Docker network (172.16.0.0/12 covers Docker's default ranges)
      # For external access, use specific IPs instead of 0.0.0.0/0
      - RPC_ALLOW_IP=172.16.0.0/12
    ports:
      - "7449:7449"
      - "7450:7450"
    volumes:
      - multichain_data:/home/multichain/.multichain
    healthcheck:
      test: ["CMD", "multichain-cli", "procuchain-dev", "getinfo"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - procuchain

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  multichain_data:
    driver: local

networks:
  procuchain:
    driver: bridge
