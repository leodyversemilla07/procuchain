services:
  mysql:
    image: mysql:8.4
    container_name: procuchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: procuchain
      MYSQL_USER: procuchain
      MYSQL_PASSWORD: procuchain
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pprocuchain", "-uprocuchain"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: procuchain-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
