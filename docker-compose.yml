services:
  mysql:
    image: mysql:9.4
    container_name: procuchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: procuchain
      MYSQL_USER: procuchain
      MYSQL_PASSWORD: procuchain
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pprocuchain", "-uprocuchain"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    driver: local
