services:
  # Single MultiChain Node for Development
  multichain:
    build:
      context: .
      dockerfile: Dockerfile.multichain
    container_name: procuchain-multichain
    restart: unless-stopped
    environment:
      - CHAIN_NAME=procuchain-dev
      - RPC_USER=multichainrpc
      - RPC_PASSWORD=multichainrpc
      - RPC_PORT=7450
      - P2P_PORT=7449
      - RPC_ALLOW_IP=0.0.0.0/0
    ports:
      - '7449:7449'
      - '7450:7450'
    volumes:
      - multichain_data:/home/multichain/.multichain
    healthcheck:
      test: ['CMD', 'multichain-cli', 'procuchain-dev', '-rpcuser=multichainrpc', '-rpcpassword=multichainrpc', 'getinfo']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - procuchain

  # HAProxy Load Balancer (single node for future scaling)
  haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    container_name: procuchain-haproxy
    restart: unless-stopped
    ports:
      - '7451:7451'
      - '8404:8404'
    networks:
      - procuchain
    depends_on:
      - multichain

volumes:
  multichain_data:
    driver: local

networks:
  procuchain:
    driver: bridge
