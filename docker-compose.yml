services:
  mysql:
    image: mysql:9.4
    container_name: procuchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: procuchain
      MYSQL_USER: procuchain
      MYSQL_PASSWORD: procuchain
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pprocuchain', '-uprocuchain']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - procuchain

  redis:
    image: redis:7-alpine
    container_name: procuchain-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - procuchain

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: procuchain-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - '8080:80'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - procuchain

  # Single MultiChain Node for Development
  multichain:
    build:
      context: .
      dockerfile: Dockerfile.multichain
    container_name: procuchain-multichain
    restart: unless-stopped
    environment:
      - CHAIN_NAME=procuchain-dev
      - RPC_USER=multichainrpc
      - RPC_PASSWORD=multichainrpc
      - RPC_PORT=7450
      - P2P_PORT=7449
      - RPC_ALLOW_IP=0.0.0.0/0
    ports:
      - '7449:7449'
      - '7450:7450'
    volumes:
      - multichain_data:/home/multichain/.multichain
    healthcheck:
      test: ['CMD', 'multichain-cli', 'procuchain-dev', '-rpcuser=multichainrpc', '-rpcpassword=multichainrpc', 'getinfo']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - procuchain

  # HAProxy Load Balancer (single node for future scaling)
  haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    container_name: procuchain-haproxy
    restart: unless-stopped
    ports:
      - '7451:7451'
      - '8404:8404'
    networks:
      - procuchain
    depends_on:
      - multichain

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  multichain_data:
    driver: local

networks:
  procuchain:
    driver: bridge
