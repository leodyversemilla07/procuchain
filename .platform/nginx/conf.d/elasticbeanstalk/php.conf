# Override EB's default nginx config for AL2023
# AL2023 deploys to /var/app/current/ but EB's default nginx points to /var/www/html/
# This file replaces the default php.conf to fix the document root

root /var/app/current/public;

index index.php index.html index.htm;

# Laravel pretty URL - forward all non-file requests to index.php
location / {
 try_files $uri $uri/ /index.php?$query_string;
}

# PDF file downloads: allow same-origin iframe embedding while keeping security.
# The PDF viewer page uses <iframe src="blob:..."> to display documents.
# Chrome blocks PDF rendering in iframes when the response has X-Frame-Options
# or CSP frame-ancestors that restrict the browser's PDF plugin.
# Fix: strip PHP/Laravel-set framing headers and replace with PDF-safe CSP.
# Security preserved: frame-ancestors 'self' (only same-origin pages can embed),
# no scripts allowed, no plugin content except the PDF itself.
location ~* ^/files/ {
 try_files $uri /index.php?$query_string;

 # Strip Laravel's generic framing headers (too restrictive for PDFs in iframes)
 fastcgi_hide_header X-Frame-Options;
 fastcgi_hide_header Content-Security-Policy;

 # Add PDF-appropriate security headers:
 # - frame-ancestors 'self': ONLY same-origin pages can embed this PDF
 # - sandbox: restricts what the embedded content can do (no scripts, no forms,
 #   no popups) — defense-in-depth even if the PDF had active content
 # - object-src 'none': no plugin content except the PDF renderer itself
 add_header X-Content-Type-Options "nosniff" always;
 add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'; sandbox allow-same-origin; object-src 'none'" always;

 # Pass to PHP
 fastcgi_split_path_info ^(.+\.php)(/.*)$;
 fastcgi_intercept_errors on;
 fastcgi_index index.php;

 fastcgi_param QUERY_STRING $query_string;
 fastcgi_param REQUEST_METHOD $request_method;
 fastcgi_param CONTENT_TYPE $content_type;
 fastcgi_param CONTENT_LENGTH $content_length;

 fastcgi_param SCRIPT_NAME $fastcgi_script_name;
 fastcgi_param REQUEST_URI $request_uri;
 fastcgi_param DOCUMENT_URI $document_uri;
 fastcgi_param DOCUMENT_ROOT $document_root;
 fastcgi_param SERVER_PROTOCOL $server_protocol;
 fastcgi_param REQUEST_SCHEME $scheme;
 fastcgi_param HTTPS $https if_not_empty;

 fastcgi_param GATEWAY_INTERFACE CGI/1.1;
 fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;

 fastcgi_param REMOTE_ADDR $remote_addr;
 fastcgi_param REMOTE_PORT $remote_port;
 fastcgi_param SERVER_ADDR $server_addr;
 fastcgi_param SERVER_PORT $server_port;
 fastcgi_param SERVER_NAME $server_name;

 fastcgi_param REDIRECT_STATUS 200;
 fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
 fastcgi_param PATH_INFO $fastcgi_path_info;
 fastcgi_pass php-fpm;
}

# Pass PHP scripts to FastCGI server
location ~ \.(php|phar)(/.*)?$ {
 fastcgi_split_path_info ^(.+\.(?:php|phar))(/.*)$;
 fastcgi_intercept_errors on;
 fastcgi_index index.php;

 fastcgi_param QUERY_STRING $query_string;
 fastcgi_param REQUEST_METHOD $request_method;
 fastcgi_param CONTENT_TYPE $content_type;
 fastcgi_param CONTENT_LENGTH $content_length;

 fastcgi_param SCRIPT_NAME $fastcgi_script_name;
 fastcgi_param REQUEST_URI $request_uri;
 fastcgi_param DOCUMENT_URI $document_uri;
 fastcgi_param DOCUMENT_ROOT $document_root;
 fastcgi_param SERVER_PROTOCOL $server_protocol;
 fastcgi_param REQUEST_SCHEME $scheme;
 fastcgi_param HTTPS $https if_not_empty;

 fastcgi_param GATEWAY_INTERFACE CGI/1.1;
 fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;

 fastcgi_param REMOTE_ADDR $remote_addr;
 fastcgi_param REMOTE_PORT $remote_port;
 fastcgi_param SERVER_ADDR $server_addr;
 fastcgi_param SERVER_PORT $server_port;
 fastcgi_param SERVER_NAME $server_name;

 fastcgi_param REDIRECT_STATUS 200;
 fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
 fastcgi_param PATH_INFO $fastcgi_path_info;
 fastcgi_pass php-fpm;
}

# Deny access to hidden files
location ~ /\. {
    deny all;
}
