global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Health check page
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats realm Haproxy\ Statistics

# MultiChain RPC Load Balancer
frontend multichain_rpc
    bind *:7451
    mode tcp
    default_backend multichain_nodes

backend multichain_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Single node for development
    server multichain procuchain-multichain:7450 check inter 5s rise 2 fall 3
