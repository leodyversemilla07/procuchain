name: browser-tests

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest

    continue-on-error: true

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: redis, pdo_sqlite, mbstring, xml, ctype, json, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm ci --legacy-peer-deps

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Browser Test Environment
        run: |
          echo "APP_ENV=testing" >> .env
          echo "QUEUE_CONNECTION=redis" >> .env
          echo "CACHE_STORE=redis" >> .env
          echo "CACHE_DRIVER=redis" >> .env
          echo "SESSION_DRIVER=redis" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "BCRYPT_ROUNDS=4" >> .env

      - name: Generate Application Key
        run: php artisan key:generate --no-interaction

      - name: Build Assets
        run: npm run build

      - name: Run Browser Tests
        run: php artisan test --compact tests/Browser
