name: Deploy to Production (EC2)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, json, bcmath, sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "."
          target: "/var/www/procuchain-tmp"
          strip_components: 0
          rm: true
          tar_tmp_path: "/tmp/"
          tar_exec: "tar"
          overwrite: true

      - name: Post-deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          command_timeout: 60s
          script: |
            set -e
            cd /var/www/procuchain-tmp
            cp /var/www/procuchain/.env .env || true
            sudo chown -R www-data:www-data .
            php artisan optimize:clear 2>&1
            php artisan optimize 2>&1
            php artisan migrate --force --no-interaction 2>&1
            sudo chmod -R 775 storage bootstrap/cache
            sudo rm -rf /var/www/procuchain-old 2>/dev/null || true
            sudo mv /var/www/procuchain /var/www/procuchain-old 2>/dev/null || true
            sudo mv /var/www/procuchain-tmp /var/www/procuchain
            sudo systemctl reload php8.4-fpm 2>/dev/null || sudo systemctl restart php8.4-fpm
            curl -s -o /dev/null -w "Health: %{http_code}\n" http://localhost/ || echo "Health check failed"