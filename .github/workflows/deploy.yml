name: Deploy to EB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: redis, pdo_sqlite, mbstring, xml, ctype, json, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-ansi --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Copy Environment
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Tests
        run: php artisan test --compact

      - name: Run Pint
        run: vendor/bin/pint --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm ci

      - name: Build Frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          application: procuchain
          environment: procuchain-prod
          version_label: ${{ github.sha }}
          region: ${{ secrets.AWS_REGION }}

      - name: Wait for Deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name procuchain \
            --environment-names procuchain-prod \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify Deployment
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://procuchain.tech/)
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed - status code: $STATUS"
            exit 1
          fi
          echo "Deployment verified - status: $STATUS"
