name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, json, bcmath, sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Generate Laravel App Key
        run: echo "APP_KEY=$(php -r 'echo "base64:" . base64_encode(random_bytes(32));')" >> .env

      - name: Generate .env for Production
        run: |
          cat > .env << 'EOF'
APP_ENV=production
APP_DEBUG=false
APP_KEY=${{ secrets.APP_KEY }}
APP_URL=http://procuchain-prod.eba-vujm352s.us-east-1.elasticbeanstalk.com
DB_CONNECTION=mysql
DB_HOST=${{ secrets.DB_HOST }}
DB_PORT=3306
DB_DATABASE=${{ secrets.DB_DATABASE }}
DB_USERNAME=${{ secrets.DB_USERNAME }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
CACHE_STORE=file
QUEUE_CONNECTION=sync
SESSION_DRIVER=file
MAIL_MAILER=log
EOF

      - name: Generate deployment package
        run: |
          # EB requires a zip with all files
          # We need vendor/ installed already
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev
          
          # Create the zip source bundle
          zip -ryq /tmp/procuchain-deploy.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".github/*" \
            -x ".agents/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "storage/logs/*" \
            -x "haproxy/*" \
            -x "docker-compose.yml" \
            -x "Dockerfile*" \
            -x "docker-*" \
            -x ".editorconfig" \
            -x ".gitattributes" \
            -x ".gitignore"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: procuchain
          environment_name: procuchain-prod
          version_label: "v-${{ github.sha }}"
          region: us-east-1
          deployment_package: /tmp/procuchain-deploy.zip
