name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, ctype, json, bcmath, sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev

      - name: Create .env
        run: |
          cat > .env << 'EOF'
APP_ENV=production
APP_DEBUG=false
APP_KEY=${{ secrets.APP_KEY }}
APP_URL=http://procuchain-prod.eba-vujm352s.us-east-1.elasticbeanstalk.com
DB_CONNECTION=mysql
DB_HOST=${{ secrets.DB_HOST }}
DB_PORT=3306
DB_DATABASE=${{ secrets.DB_DATABASE }}
DB_USERNAME=${{ secrets.DB_USERNAME }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
CACHE_STORE=file
QUEUE_CONNECTION=sync
SESSION_DRIVER=file
MAIL_MAILER=log
EOF

      - name: Create deployment package
        run: |
          zip -ryq /tmp/deploy.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".github/*" \
            -x ".agents/*" \
            -x "haproxy/*" \
            -x "docker-compose.yml" \
            -x "Dockerfile*" \
            -x "docker-*" \
            -x ".editorconfig" \
            -x ".gitattributes" \
            -x ".gitignore" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "storage/logs/*"

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: procuchain
          environment_name: procuchain-prod
          version_label: "v-${{ github.sha }}"
          region: us-east-1
          deployment_package: /tmp/deploy.zip
